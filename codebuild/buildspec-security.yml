version: 0.2
phases:
  install:
    commands:
      - python --version
      - pip install --no-cache-dir semgrep
  build:
    commands:
      - echo 'Running isolated security scan'
      - semgrep scan --config p/security-audit --json --output semgrep.json . || true
      - test -f semgrep.json
      - |
        python - <<'PY'
        import json
        import os

        with open("semgrep.json", encoding="utf-8") as handle:
            semgrep = json.load(handle)

        envelope = {
            "repository": os.environ["TRIAGER_REPOSITORY"].removeprefix("https://github.com/").removesuffix(".git"),
            "pull_request_number": int(os.environ["TRIAGER_PR_NUMBER"]),
            "build_id": os.environ["CODEBUILD_BUILD_ID"],
            "build_status": os.environ.get("CODEBUILD_BUILD_SUCCEEDING", "0"),
            "findings": semgrep.get("results", []),
        }
        with open("triager-result.json", "w", encoding="utf-8") as handle:
            json.dump(envelope, handle)
        PY
      - aws s3 cp triager-result.json "s3://${TRIAGER_RESULT_BUCKET}/results/${CODEBUILD_BUILD_ID}.json"
artifacts:
  files:
    - semgrep.json
    - triager-result.json
  discard-paths: yes
