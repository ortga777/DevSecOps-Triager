AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Production AWS SAM stack for DevSecOps-Triager hackathon demo.

Parameters:
  DeciderModelId:
    Type: String
    Description: Bedrock model ID used by Strands Agents.
  GitHubSecretArn:
    Type: String
    Description: Secrets Manager ARN containing GitHub credentials or GitHub App credentials.
  GitHubWebhookSecretArn:
    Type: String
    Description: Secrets Manager ARN containing the GitHub webhook secret.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 1024
    Tracing: Active
    Environment:
      Variables:
        DECIDER_MODEL_ID: !Ref DeciderModelId
        GITHUB_SECRET_ARN: !Ref GitHubSecretArn
        GITHUB_WEBHOOK_SECRET_ARN: !Ref GitHubWebhookSecretArn
        IDEMPOTENCY_TABLE: !Ref IdempotencyTable
        MAX_DIFF_CHARS: '60000'
        MAX_LOG_CHARS: '30000'
        APPROVAL_REQUIRED: 'true'
        GITHUB_AUTH_MODE: 'app'
        CODEBUILD_PROJECT_NAME: !Ref SecurityScanProject

Resources:
  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_key
          AttributeType: S
      KeySchema:
        - AttributeName: event_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  SecurityScanProject:
    Type: AWS::CodeBuild::Project
    Properties:
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Source:
        Type: NO_SOURCE
        BuildSpec: codebuild/buildspec-security.yml
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: false

  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SecurityScanLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  TriagerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.handler.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: '*'
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref GitHubSecretArn
                - !Ref GitHubWebhookSecretArn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt IdempotencyTable.Arn
            - Effect: Allow
              Action:
                - codebuild:StartBuild
              Resource: !GetAtt SecurityScanProject.Arn
      Events:
        GitHubWebhook:
          Type: Api
          Properties:
            Path: /webhook/github
            Method: post

Outputs:
  WebhookUrl:
    Description: GitHub webhook endpoint.
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/webhook/github'
  IdempotencyTableName:
    Description: DynamoDB table used to suppress duplicate webhook deliveries.
    Value: !Ref IdempotencyTable
